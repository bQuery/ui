name: Bug report
description: Report a reproducible problem in @bquery/ui.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve @bquery/ui.

        Please provide enough detail for maintainers to reproduce the problem. If you are reporting a security issue, do **not** open a public issue — use the private security contact instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this on a supported browser or runtime.
          required: true
        - label: I included a minimal reproduction or clear reproduction steps.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug.
      placeholder: What happened, and why is it a problem?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Share the exact steps, sample code, repo link, or sandbox needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: shell
  - type: dropdown
    id: area
    attributes:
      label: Affected component or area
      options:
        - accordion
        - alert
        - avatar
        - badge
        - breadcrumbs
        - button
        - card
        - checkbox
        - chip
        - dialog
        - divider
        - drawer
        - dropdown-menu
        - empty-state
        - icon-button
        - input
        - pagination
        - progress
        - radio
        - segmented-control
        - select
        - skeleton
        - slider
        - spinner
        - stat-card
        - switch
        - table
        - tabs
        - textarea
        - toast
        - tooltip
        - tokens
        - theme
        - i18n
        - utils
        - docs
        - build or tooling
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@bquery/ui version"
      placeholder: 1.14.0
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: "@bquery/bquery version"
      placeholder: 1.14.1
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime / Browser
      placeholder: Chrome 136, Safari 18, Bun 1.3.13
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
